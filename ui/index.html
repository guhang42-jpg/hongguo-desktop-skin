<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>红果短剧</title>
<style>
  :root{
    --bg:#15171e;
    --panel:rgba(31,35,45,.72);
    --line:rgba(255,255,255,.12);
    --text:#fdfdff;
    --muted:rgba(238,242,250,.72);
    --muted-2:rgba(238,242,250,.44);
    --accent:#ff7a55;
    --accent-2:#ffb057;
    --r:20px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#05070d;color:var(--text);overflow:hidden;
    font-family:"HarmonyOS Sans SC","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .bg{position:fixed;inset:-18%;z-index:-4;background:#0b0f18 center/cover no-repeat;filter:blur(96px) saturate(110%) brightness(.5);opacity:.22;transform:scale(1.06);transition:background-image .5s}
  .veil{position:fixed;inset:0;z-index:-3;background:
    radial-gradient(1200px 760px at 6% -8%, rgba(255,122,85,.10), transparent 62%),
    radial-gradient(1000px 800px at 98% 106%, rgba(96,132,255,.10), transparent 66%),
    linear-gradient(180deg, rgba(5,8,14,.9), rgba(5,8,14,.94) 48%, rgba(4,6,12,.985))}

  /* ---------- 幽光 / 星空 / 流星 ---------- */
  .ambient{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;transition:opacity .5s}
  .aura{position:absolute;border-radius:50%;filter:blur(76px);mix-blend-mode:screen;will-change:transform,opacity;
    opacity:.5;transition:background 1s var(--ease),opacity .9s;
    translate:calc(var(--mx,0) * 16px) calc(var(--my,0) * 11px)}
  .aura.a1{width:62vw;height:62vw;left:-14vw;top:-24vw;background:var(--aura1,rgba(255,122,85,.5));animation:driftA 28s ease-in-out infinite alternate}
  .aura.a2{width:54vw;height:54vw;right:-16vw;bottom:-20vw;background:var(--aura2,rgba(96,132,255,.42));opacity:.44;animation:driftB 34s ease-in-out infinite alternate}
  .aura.a3{width:40vw;height:40vw;left:34vw;top:26vh;background:var(--aura3,rgba(255,206,150,.34));opacity:.28;animation:driftC 24s ease-in-out infinite alternate}
  @keyframes driftA{to{transform:translate3d(7vw,5vh,0) scale(1.14)}}
  @keyframes driftB{to{transform:translate3d(-6vw,-5vh,0) scale(1.1)}}
  @keyframes driftC{to{transform:translate3d(5vw,-6vh,0) scale(1.16)}}
  #sky{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
  .nebula{position:absolute;inset:0;background:
    radial-gradient(closest-side at 72% 18%, rgba(140,200,255,.10), transparent 70%),
    radial-gradient(closest-side at 18% 78%, rgba(255,150,120,.10), transparent 70%)}
  body.mini .ambient{display:none}

  /* ---------- 窗口外壳 ---------- */
  .shell{position:relative;height:100vh;display:flex;flex-direction:column}
  .shell::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;z-index:3;pointer-events:none;
    background:linear-gradient(90deg,transparent,var(--glow1,rgba(255,150,120,.5)),transparent);opacity:.5}
  .winbar{display:none;height:34px;flex:none;align-items:center;justify-content:flex-end;gap:3px;padding:0 8px;user-select:none;
    position:relative;z-index:5;opacity:.32;transition:opacity .28s var(--ease)}
  .winbar.show{display:flex}
  .winbar:hover{opacity:1}
  .wb{width:38px;height:26px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;transition:all .15s}
  .wb:hover{background:rgba(255,255,255,.16);color:#fff}
  .wb.close:hover{background:#e5484d;color:#fff}

  .app{flex:1;display:grid;grid-template-columns:236px minmax(0,1fr);min-height:0}

  /* ---------- 左侧栏 ---------- */
  .side{padding:8px 16px 16px;display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;align-items:center;gap:11px;padding:10px 10px 22px}
  .brand .mark{width:40px;height:40px;border-radius:12px;overflow:hidden;padding:0;
    box-shadow:0 8px 24px rgba(255,110,80,.4)}
  .brand .mark img{width:100%;height:100%;object-fit:cover;display:block}
  .brand .txt{display:flex;flex-direction:column;gap:2px}
  .brand b{font-size:18px;letter-spacing:.6px}
  .brand small{font-size:10.5px;color:var(--muted-2);letter-spacing:1.2px}

  .nav{display:flex;flex-direction:column;gap:4px}
  .nav button{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border:0;border-radius:14px;background:transparent;
    color:var(--muted);font-family:inherit;font-size:14.5px;cursor:pointer;transition:all .18s var(--ease);text-align:left}
  .nav button i{width:24px;text-align:center;font-size:15px;opacity:.85;font-style:normal}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav button.on{background:linear-gradient(135deg,rgba(255,122,85,.24),rgba(255,122,85,.1));
    color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,122,85,.3)}
  .nav button.on i{color:var(--accent);opacity:1}

  .side .spacer{flex:1}
  .who{display:flex;align-items:center;gap:11px;padding:11px;border-radius:16px;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid var(--line);transition:all .18s var(--ease)}
  .who:hover{background:rgba(255,255,255,.12)}
  .who .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;
    background:linear-gradient(135deg,#ffb057,#ff6b4a);color:#1a1c22;font-weight:800}
  .who .tt{min-width:0;display:flex;flex-direction:column;gap:3px}
  .who .tt b{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .tt span{font-size:10.5px;color:var(--muted-2);display:flex;align-items:center;gap:5px}
  .who .tt span em{width:6px;height:6px;border-radius:50%;background:#4ade80;font-style:normal}
  .who.off .tt span em{background:rgba(255,255,255,.32)}
  .who .xbar{height:3px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
  .who .xbar i{display:block;height:100%;width:6%;border-radius:99px;
    background:linear-gradient(90deg,#ffc46b,#ff5f3d);transition:width .45s var(--ease)}
  .who .lvt{flex:none;margin-left:auto;font-size:10px;font-weight:800;color:#ffe0b0;letter-spacing:.3px;
    background:rgba(255,176,87,.18);border:1px solid rgba(255,176,87,.4);padding:3px 7px;border-radius:9px}

  /* ---------- 右侧内容 ---------- */
  .content{display:flex;flex-direction:column;min-width:0;min-height:0;padding-right:14px}
  header.top{display:flex;align-items:center;gap:12px;padding:10px 12px 12px 2px;flex:none}
  .tabs{display:flex;gap:3px;padding:4px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid var(--line);backdrop-filter:blur(22px)}
  .tab{border:0;background:transparent;color:var(--muted);font-size:13.5px;font-family:inherit;padding:8px 18px;border-radius:999px;
    cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
  .tab:hover{color:#fff}
  .tab.on{background:#fff;color:#15171e;font-weight:700;box-shadow:0 3px 18px rgba(0,0,0,.32)}
  .grow{flex:1}
  .search{display:flex;align-items:center;gap:9px;width:250px;height:40px;padding:0 15px;border-radius:999px;
    background:rgba(255,255,255,.1);border:1px solid var(--line);transition:all .24s var(--ease)}
  .search:focus-within{width:330px;background:rgba(255,255,255,.19);border-color:rgba(255,255,255,.32)}
  .search input{flex:1;border:0;background:transparent;color:#fff;font-size:13px;font-family:inherit;outline:none}
  .search input::placeholder{color:var(--muted-2)}
  .ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.1);
    color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .18s var(--ease);font-size:14px}
  .ic:hover{background:rgba(255,255,255,.22);color:#fff;transform:translateY(-1px)}

  main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 12px 150px 2px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
  main::-webkit-scrollbar{width:9px}
  main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}

  /* 大图 hero */
  .hero{position:relative;display:flex;align-items:center;gap:26px;height:284px;border-radius:26px;overflow:hidden;margin-bottom:26px;
    padding:0 34px;border:1px solid rgba(255,255,255,.16);box-shadow:0 26px 64px rgba(0,0,0,.42);cursor:pointer;background:#1b1e26}
  .hero .cover{position:absolute;inset:0;background-size:cover;background-position:center 22%;transform:scale(1.06);
    filter:saturate(130%) brightness(1.06);transition:transform .5s var(--ease);will-change:transform}
  .hero:hover .cover{transform:scale(1.1) translate3d(calc(var(--mx,0) * 10px),calc(var(--my,0) * 7px),0)}
  .sparks{position:absolute;inset:0;z-index:2;pointer-events:none}
  .sparks i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;
    box-shadow:0 0 10px 3px var(--glow1,rgba(255,160,120,.45));opacity:0;animation:spk 11s linear infinite}
  .sparks i:nth-child(1){left:16%;top:72%;animation-delay:0s}
  .sparks i:nth-child(2){left:42%;top:20%;animation-delay:2.4s;animation-duration:13s}
  .sparks i:nth-child(3){left:63%;top:64%;animation-delay:4.1s}
  .sparks i:nth-child(4){left:78%;top:34%;animation-delay:6.2s;animation-duration:14s}
  .sparks i:nth-child(5){left:30%;top:44%;animation-delay:8s}
  .sparks i:nth-child(6){left:90%;top:76%;animation-delay:9.4s;animation-duration:12s}
  @keyframes spk{
    0%{opacity:0;transform:translate3d(0,10px,0) scale(.5)}
    18%{opacity:.9}
    60%{opacity:.75;transform:translate3d(14px,-34px,0) scale(1)}
    100%{opacity:0;transform:translate3d(-8px,-82px,0) scale(.35)}
  }
  .hero .veil2{position:absolute;inset:0;background:
    linear-gradient(96deg,rgba(16,18,24,.94) 0%,rgba(16,18,24,.78) 42%,rgba(16,18,24,.18) 76%,rgba(16,18,24,.4) 100%)}
  .hero .body{position:relative;z-index:2;display:flex;flex-direction:column;gap:11px;max-width:min(560px,62%)}
  .hero .meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;color:rgba(255,255,255,.82)}
  .chip{font-size:11.5px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px)}
  .chip.hot{background:rgba(255,122,85,.36);color:#ffe6dd;font-weight:700}
  .chip.rate{background:rgba(255,209,102,.22);color:#ffd166;font-weight:700}
  .hero h1{font-size:40px;font-weight:800;line-height:1.14;letter-spacing:.6px;
    text-shadow:0 0 26px var(--glow1,rgba(255,150,120,.5)),0 8px 30px rgba(0,0,0,.55)}
  .hero::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
    background:linear-gradient(112deg,transparent 44%,rgba(255,255,255,.13) 50%,transparent 56%);
    transform:translateX(-70%);animation:sweep 9s var(--ease) infinite}
  @keyframes sweep{0%,72%{transform:translateX(-72%)}100%{transform:translateX(72%)}}
  .hero .strip{position:absolute;left:9px;top:15px;bottom:15px;width:13px;z-index:4;border-radius:7px;
    background:repeating-linear-gradient(180deg,
      rgba(255,182,201,.75) 0 15px,rgba(0,0,0,0) 15px 20px,
      rgba(255,216,168,.72) 20px 35px,rgba(0,0,0,0) 35px 40px,
      rgba(186,229,255,.7) 40px 55px,rgba(0,0,0,0) 55px 60px,
      rgba(214,201,255,.7) 60px 75px,rgba(0,0,0,0) 75px 80px);
    opacity:.65;mix-blend-mode:screen}
  .hero .desc{font-size:13px;line-height:1.85;color:rgba(255,255,255,.78);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .acts{display:flex;gap:11px;margin-top:8px}
  .btn{display:flex;align-items:center;gap:8px;height:46px;padding:0 24px;border:0;border-radius:999px;font-family:inherit;
    font-size:14.5px;cursor:pointer;transition:all .18s var(--ease)}
  .btn.p{background:linear-gradient(135deg,#fff,#ffe9e0);color:#15171e;font-weight:800}
  .btn.p:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(255,255,255,.3)}
  .btn.g{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(12px)}
  .btn.g:hover{background:rgba(255,255,255,.26);transform:translateY(-2px)}
  .hero .poster{position:relative;z-index:2;margin-left:auto;flex:none;width:186px;aspect-ratio:3/4;border-radius:18px;overflow:hidden;
    border:1px solid rgba(255,255,255,.24);box-shadow:0 22px 48px rgba(0,0,0,.5);background:#23262f}
  .hero .poster div{position:absolute;inset:0;background-size:cover;background-position:center}

  /* 分区标题 */
  .sec{display:flex;align-items:baseline;gap:12px;margin:30px 0 16px}
  .sec h2{font-size:23px;font-weight:800;letter-spacing:.4px}
  .sec .cnt{font-size:12px;color:var(--muted-2)}
  .sec .rule{flex:1;height:1px;background:var(--line);transform:translateY(-4px)}
  .link{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-family:inherit;cursor:pointer;padding:6px 10px;border-radius:9px}
  .link:hover{color:#fff;background:rgba(255,255,255,.1)}

  /* 继续观看（横滑小卡） */
  .hrow{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
  .hrow::-webkit-scrollbar{display:none}
  .hcard{position:relative;flex:none;width:268px;height:152px;border-radius:18px;overflow:hidden;cursor:pointer;
    border:1px solid rgba(255,255,255,.14);background:#22262f;transition:transform .24s var(--ease)}
  .hcard:hover{transform:translateY(-4px)}
  .hcard img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.92)}
  .hcard .hg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06) 40%,rgba(0,0,0,.82))}
  .hcard .hn{position:absolute;left:12px;right:12px;bottom:11px;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 2px 8px rgba(0,0,0,.8)}
  .hcard .hs{position:absolute;left:12px;right:12px;bottom:31px;font-size:11px;color:rgba(255,255,255,.72);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  .hcard .hb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18)}
  .hcard .hb em{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .hcard .hp{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.92);color:#15171e;font-size:12px;opacity:0;transform:scale(.85);transition:all .2s var(--ease)}
  .hcard:hover .hp{opacity:1;transform:none}

  /* 热播榜横条 */
  .rrow{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
  .rrow::-webkit-scrollbar{display:none}
  .ritem{position:relative;flex:none;width:138px;cursor:pointer}
  .ritem .rk{position:absolute;left:6px;top:4px;z-index:2;font-size:22px;font-weight:800;font-style:italic;
    color:#ffd166;text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .ritem .rc{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#22262f}
  .ritem .rc img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease)}
  .ritem:hover .rc img{transform:scale(1.07)}
  .ritem p{font-size:12.5px;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ritem span{font-size:11px;color:var(--muted-2)}

  /* 推荐网格 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:28px 22px}
  .card{cursor:pointer;transition:transform .24s var(--ease);animation:fade .36s var(--ease) both}
  .card:hover{transform:translateY(-8px)}
  .card .cov{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:#1f232c;
    box-shadow:0 14px 36px rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.1)}
  .card .cov img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s var(--ease)}
  .card:hover .cov img{transform:scale(1.06)}
  .card .cov .grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 56%,rgba(0,0,0,.62))}
  .badge{position:absolute;right:10px;bottom:10px;font-size:11.5px;padding:4px 9px;border-radius:9px;background:rgba(0,0,0,.62);backdrop-filter:blur(10px)}
  .score{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;color:#ffd7a3;padding:4px 8px;border-radius:9px;
    background:rgba(0,0,0,.56);backdrop-filter:blur(10px)}
  .card .cov .hov{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .22s var(--ease);
    background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.34),transparent 70%)}
  .card:hover .cov .hov{opacity:1}
  .card .cov .hov b{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.96);color:#15171e;display:grid;place-items:center;
    font-size:18px;box-shadow:0 14px 36px rgba(0,0,0,.48);transform:scale(.86);transition:transform .22s var(--ease)}
  .card:hover .cov .hov b{transform:scale(1)}
  .card h3{font-size:16.5px;font-weight:700;margin:12px 2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card p{font-size:12.5px;color:var(--muted);margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .foot{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px 0 12px;color:var(--muted-2);font-size:13px}
  .spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.18);border-top-color:#fff;animation:sp .8s linear infinite}
  .empty{padding:60px 0;text-align:center;color:var(--muted-2);font-size:13.5px;line-height:2}

  /* 底部悬浮播放条 */
  .player{position:absolute;left:calc(50% + 118px);bottom:16px;transform:translateX(-50%);z-index:30;width:min(940px,calc(100% - 300px));height:78px;
    display:none;align-items:center;gap:14px;padding:0 16px 0 12px;border-radius:999px;background:rgba(36,40,50,.72);
    border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(32px) saturate(170%);box-shadow:0 22px 58px rgba(0,0,0,.46);
    animation:fade .3s var(--ease) both}
  .player.on{display:flex}
  .player .pc{width:54px;height:54px;border-radius:14px;object-fit:cover;flex:none;background:#222}
  .player .pi{width:172px;flex:none;min-width:0}
  .player .pt{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .player .ps{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .player .pm{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
  .player .ctrl{display:flex;align-items:center;justify-content:center;gap:4px}
  .player .ctrl button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:rgba(255,255,255,.85);cursor:pointer;font-size:13px;transition:all .16s var(--ease)}
  .player .ctrl button:hover{background:rgba(255,255,255,.16);color:#fff}
  .player .pp{width:42px!important;height:42px!important;background:#fff!important;color:#15171e!important;font-size:15px}
  .bar{height:4px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;height:100%;border-radius:99px;background:#fff}
  .pline{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted-2);font-variant-numeric:tabular-nums}
  .pill{height:31px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);
    color:var(--muted);font-size:11.5px;font-family:inherit;cursor:pointer;transition:all .16s var(--ease);white-space:nowrap}
  .pill:hover{background:rgba(255,255,255,.22);color:#fff}

  /* 详情抽屉 */
  .mask{position:fixed;inset:0;z-index:40;background:rgba(10,11,15,.5);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;top:0;right:0;bottom:0;width:min(474px,94vw);z-index:41;padding:22px;overflow-y:auto;
    background:rgba(27,30,38,.9);border-left:1px solid rgba(255,255,255,.16);backdrop-filter:blur(36px) saturate(160%);
    transform:translateX(102%);transition:transform .32s var(--ease);scrollbar-width:thin}
  .sheet.on{transform:none}

  .ach small{font-size:10.5px;color:var(--muted-2);line-height:1.45}
  .ach:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.28)}
  .ach.on{background:linear-gradient(135deg,rgba(255,176,87,.24),rgba(255,255,255,.05));
    border-color:rgba(255,176,87,.44);box-shadow:0 12px 28px rgba(0,0,0,.28)}
  .ach.on i{filter:none;opacity:1}
  .ach.on b{color:#fff}
  .ach.on small{color:rgba(255,255,255,.68)}

  .gtoast{position:fixed;left:50%;bottom:112px;z-index:60;display:flex;align-items:center;gap:14px;
    padding:14px 24px 14px 16px;border-radius:18px;opacity:0;pointer-events:none;
    transform:translate(-50%,26px) scale(.96);transition:all .34s var(--ease);
    background:rgba(20,23,30,.88);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(22px);
    box-shadow:0 22px 54px rgba(0,0,0,.5)}
  .gtoast.on{opacity:1;transform:translate(-50%,0) scale(1)}
  .gtoast .gi{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(135deg,rgba(255,176,87,.34),rgba(255,95,61,.3));border:1px solid rgba(255,176,87,.4)}
  .gtoast .gt{display:flex;flex-direction:column;gap:3px}
  .gtoast .gt b{font-size:14.5px;font-weight:800}
  .gtoast .gt small{font-size:11.5px;color:var(--muted-2)}
  .gtoast.lv{border-color:rgba(255,176,87,.62);
    box-shadow:0 0 0 1px rgba(255,176,87,.28),0 24px 60px rgba(255,122,85,.34)}
  .gtoast.lv .gi{animation:lvpop .8s var(--ease)}
  @keyframes lvpop{0%{transform:scale(.55) rotate(-14deg)}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="veil"></div>
<div class="ambient" id="ambient">
  <div class="aura a1"></div>
  <div class="aura a2"></div>
  <div class="aura a3"></div>
  <div class="nebula"></div>
  <canvas id="sky"></canvas>
</div>

<div class="shell">
  <div class="winbar" id="winbar">
    <button class="wb" id="wbMini" title="小窗模式（刷剧小窗）">⧉</button><button class="wb" id="wbMin">—</button><button class="wb" id="wbMax">▢</button><button class="wb close" id="wbClose">✕</button>
  </div>

  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="mark"><img src="icon.png" alt="红果短剧"></div>
        <div class="txt"><b>红果短剧</b><small>DESKTOP</small></div>
      </div>

      <nav class="nav rail">
        <button class="on" data-view="home"><i>▦</i>发现</button>
        <button data-view="category"><i>▤</i>找剧</button>
        <button data-view="rank"><i>◈</i>榜单</button>
        <button data-view="mine"><i>◍</i>我的</button>
      </nav>

      <div class="spacer"></div>

      <div class="who off" id="sideWho">
        <div class="av" id="sideAv">我</div>
        <div class="tt">
          <b id="sideName">未登录</b>
          <span><em></em><label id="sideSync">点此登录同步</label></span>
          <div class="xbar"><i id="sideExp" style="width:6%"></i></div>
        </div>
        <div class="lvt" id="sideLv">Lv 1</div>
      </div>
    </aside>

    <div class="content">
      <header class="top">
        <div class="tabs" id="tabs"></div>
        <div class="grow"></div>
        <div class="search"><span style="opacity:.6">⌕</span><input id="q" placeholder="搜短剧 / 演员"></div>
        <button class="ic" id="refresh" title="刷新">⟳</button>
        <button class="ic" id="accountBtn" title="我的账号">◍</button>
      </header>

      <main id="main">
        <section class="hero" id="hero">
          <div class="cover" id="heroCover"></div>
          <div class="veil2"></div>
          <div class="sparks"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="strip"></div>
          <div class="body">
            <div class="meta"><span class="chip hot">正在热播</span><span class="chip rate" id="heroRate">★ 9.0</span><span id="heroMeta"></span></div>
            <h1 id="heroTitle">加载中…</h1>
            <div class="desc" id="heroSub"></div>
            <div class="acts">
              <button class="btn p" id="heroPlay">▶ 立即观看</button>
              <button class="btn g" id="heroFollow">♡ 追更</button>
            </div>
          </div>
          <div class="poster"><div id="heroPoster"></div></div>
        </section>

        <div id="contSec" style="display:none">
          <div class="sec"><h2>继续观看</h2><span class="cnt" id="contCount"></span><div class="rule"></div></div>
          <div class="hrow" id="contRow"></div>
        </div>

        <div id="rankSec" style="display:none">
          <div class="sec"><h2>热播榜</h2><span class="cnt">实时排行</span><div class="rule"></div>
            <button class="link" id="rankMore">看完整榜单 ›</button></div>
          <div class="rrow" id="rankRow"></div>
        </div>

        <div class="sec">
          <h2 id="secTitle">为你推荐</h2><span class="cnt" id="secCount"></span><div class="rule"></div>
          <button class="link" id="secMore">换一批 ⟳</button>
        </div>
        <div class="grid" id="grid"></div>
        <div class="foot" id="foot"></div>
      </main>
    </div>
  </div>

  <div class="player" id="player">
    <img class="pc" id="pCover" alt="">
    <div class="pi"><div class="pt" id="pTitle">未在播放</div><div class="ps" id="pSub">挑一部剧开始看吧</div></div>
    <div class="pm">
      <div class="ctrl">
        <button id="pPrev" title="上一集">⏮</button>
        <button class="pp" id="pPlay" title="播放/暂停">▶</button>
        <button id="pNext" title="下一集">⏭</button>
      </div>
      <div class="pline"><span id="pCur">00:00</span><div class="bar" id="pBar"><i id="pFill"></i></div><span id="pDur">00:00</span></div>
    </div>
    <button class="pill" id="pEps">选集</button>
    <button class="pill" id="pOpen" title="全屏播放">⛶</button>
  </div>
</div>

<div class="mask" id="mask"></div>
<aside class="sheet" id="sheet">
  <div class="shead"><span class="hint">详情 · ESC 关闭</span><button class="xb" id="sheetClose">✕</button></div>
  <div class="sbody">
    <img id="sCover" alt="">
    <div class="smeta"><h3 id="sTitle"></h3><div class="sub" id="sSub"></div></div>
  </div>
  <div class="sdesc" id="sDesc"></div>
  <div class="sacts">
    <button class="btn p" id="sPlay">▶ 从头播放</button>
    <button class="btn g" id="sFav">♡ 收藏</button>
    <button class="btn g" id="sFollow">🔔 追更</button>
  </div>
  <div class="ephead"><strong style="font-size:14px">选集</strong><span id="sEpCount"></span></div>
  <div class="eps" id="sEps"></div>
</aside>

<div class="viewer" id="viewer">
  <div class="vbg" id="vbg"></div>
  <div class="vscrim"></div>
  <div class="vtop">
    <button class="vb" id="vBack">‹</button>
    <div class="vtitle" id="vTitle">—</div>
    <div class="grow"></div>
    <button class="vbtn on" id="dmToggle">弹幕 开</button>
  </div>
  <div class="vstage">
    <div class="vposter" id="vPoster"></div>
    <video id="video" playsinline webkit-playsinline preload="metadata"></video>
    <div class="vvig"></div>
    <div class="dmlayer" id="dmLayer"></div>
    <div class="vload hide" id="vLoad"><span class="spin"></span></div>
    <div class="vpause" id="vPause"><b>❚❚</b></div>
  </div>
  <div class="nextcue" id="nextcue">
    <span class="cd" id="ncCd">5</span>
    <span>即将播放 <b id="ncEp">下一集</b></span>
    <button id="ncGo" class="go">立即</button>
    <button id="ncCancel">取消</button>
  </div>
  <div class="vctrl">
      <div class="vline"><span id="vCur">00:00</span><div class="vbar" id="vBar"><i id="vFill"></i></div><span id="vDur">00:00</span></div>
      <div class="vrow">
        <button class="vbtn" id="vPrev">⏮</button>
        <button class="vbtn on" id="vPlay">❚❚</button>
        <button class="vbtn" id="vNext">⏭</button>
        <button class="vq" id="vRetry">⟳ 重试</button>
        <div id="vQual" style="display:flex;gap:6px"></div>
        <div class="dminput"><input id="dmText" placeholder="发条弹幕，回车发送…" maxlength="40"><button class="dmsend" id="dmSend">发送</button></div>
        <button class="vbtn" id="vEps">选集</button>
        <button class="vbtn" id="vFull" title="全屏（双击画面或按 F 也可）">⛶</button>
        <button class="vbtn" id="fitBtn" title="画面铺满方式：原比例 / 铺满裁剪 / 拉伸">▭</button>
        <button class="vbtn" id="miniExit" style="display:none">退出小窗</button>
        <button class="vbtn" id="tnBtn" style="display:none">透明</button>
      </div>
  </div>
</div>

<div class="acct" id="acct">
  <div class="acard">
    <div class="ah"><h3>我的账号</h3><button class="xb" id="acctClose">✕</button></div>
    <div class="st" id="acctState">未登录 · 登录后可同步追更、收藏和播放进度</div>
    <div class="seg" id="acctSeg"><button class="on" data-m="qr">扫码登录</button><button data-m="phone">手机号登录</button></div>
    <div id="acctQr">
      <div class="qrbox" id="qrBox"><span class="spin"></span></div>
      <div class="rowbtn"><button class="btn g" id="qrRefresh">重新生成</button><button class="btn g" id="qrCancel">取消</button></div>
    </div>
    <div id="acctPhone" style="display:none">
      <input class="inp" id="acctNo" placeholder="手机号（11 位）">
      <input class="inp" id="acctCode" placeholder="短信验证码">
      <div class="rowbtn"><button class="btn g" id="sendCode">获取验证码</button><button class="btn p" id="doLogin">登录</button></div>
    </div>
    <div id="acctLogged" style="display:none">
      <div class="auid" id="acctUid"></div>
      <div class="rowbtn"><button class="btn p" id="doSync">同步记录</button><button class="btn g" id="doLogout">退出登录</button></div>
    </div>
    <div class="msg" id="acctMsg"></div>
  </div>
</div>

<div class="gtoast" id="gtoast"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
